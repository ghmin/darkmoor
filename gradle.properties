org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

# AndroidX (required by AGP 8.x; libGDX 1.14 still targets the legacy support
# library for its AndroidApplication base class, but enabling AndroidX here is
# safe and lets you mix in AndroidX-aware dependencies later).
android.useAndroidX=true
android.nonTransitiveRClass=true
