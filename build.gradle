buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    dependencies {
        // Android Gradle Plugin 8.5.x requires Gradle 8.7+ and JDK 17+.
//        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'
    repositories {

        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/spring/' }

        maven { url 'https://mirrors.huaweicloud.com/repository/maven/' }

        mavenLocal()
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    }
    version = '1.0'
    ext {
        appName     = 'darkmoor'
        gdxVersion  = '1.14.2'   // latest stable libGDX as of 2026-06
        // Other versions retained for reference / future re-enablement of ios/html modules.
        roboVMVersion       = '1.0.0-beta-03'   // legacy, ios module disabled
        box2DLightsVersion  = '1.5'
        ashleyVersion       = '1.7.4'
        aiVersion           = '1.8.2'
    }

}

// -----------------------------------------------------------------------------
// Common Java toolchain: build with JDK 21, but keep the shared `core` module
// compiled to Java 8 bytecode so that the Android subproject can consume it
// (Android runtime does not yet understand Java 21 bytecode natively).
// -----------------------------------------------------------------------------
subprojects { sp ->
    plugins.withId('java') {
        sp.apply plugin: 'java'
        sp.java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
        sp.compileJava.options.encoding = 'UTF-8'
        sp.compileTestJava.options.encoding = 'UTF-8'
    }
}

project(':desktop') {
    apply plugin: 'java'

    // Desktop can use the full JDK 21 source level.
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependencies {
        implementation project(':core')
        // LWJGL3 is now the default desktop backend in libGDX (since 1.11.0).
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    }
}
