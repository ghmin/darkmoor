project(':core') {
    apply plugin: 'java-library'

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        // Local utility jar (org.ntk.commons.StringUtils) - kept as-is.
        implementation files('../libs/ntk-commons-android-0.1.jar')
    }
}

// Eclipse housekeeping (kept from original).
tasks.eclipse.doLast {
    delete '.project'
}
