apply plugin: 'com.android.application'

android {
    // AGP 8+ requires the namespace here (previously declared as `package` in AndroidManifest.xml).
    namespace 'com.ntk.darkmoor.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ntk.darkmoor.android'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [ 'src' ]
            resources.srcDirs = [ 'src' ]
            aidl.srcDirs = [ 'src' ]
            renderscript.srcDirs = [ 'src' ]
            res.srcDirs = [ 'res' ]
            assets.srcDirs = [ 'assets' ]
        }
        androidTest.setRoot 'tests'
    }

    packaging {
        // libGDX ships duplicate files across native jars; let AGP pick the first one.
        jniLibs.useLegacyPackaging = false
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives    "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives    "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives    "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives    "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives    "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives    "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives    "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives    "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

// Extract native .so files from the `natives` configuration into the per-ABI
// jniLibs folders so they get packaged into the APK. Replaces the old
// `tasks.withType(PackageApplication).jniFolders` API removed in AGP 8.
task copyAndroidNatives {
    doFirst {
        [ 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' ].each { abi ->
            file("libs/${abi}").mkdirs()
        }
        configurations.natives.files.each { jar ->
            def abi = jar.name.find(/natives-(armeabi-v7a|arm64-v8a|x86|x86_64)\.jar/) { _, a -> a }
            if (abi) {
                copy {
                    from zipTree(jar)
                    into "libs/${abi}"
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.matches(/merge.*JniLibFolders|package.*Debug|package.*Release/) }.configureEach {
    it.dependsOn copyAndroidNatives
}

// `run` task: launches the app on a connected device via adb.
task run(type: Exec) {
    def localProperties = project.file('../local.properties')
    def path = null
    if (localProperties.exists()) {
        Properties props = new Properties()
        localProperties.withInputStream { props.load(it) }
        path = props.getProperty('sdk.dir') ?: "$System.env.ANDROID_HOME"
    } else {
        path = "$System.env.ANDROID_HOME"
    }
    def adb = path + '/platform-tools/adb'
    commandLine adb, 'shell', 'am', 'start', '-n',
        'com.ntk.darkmoor.android/.com.ntk.darkmoor.android.AndroidLauncher'
}
